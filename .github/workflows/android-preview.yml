name: Standalone Accounting Android Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/android-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web preview
        run: npm run build
      - name: Initialize Android
        run: npx cap add android
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: artk-accounting-source-preview-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
