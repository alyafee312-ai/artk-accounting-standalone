name: Standalone Accounting Android Preview
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/offline-original-ui-*']
    paths: ['src/**', 'floot-source/**', 'package*.json', 'tsconfig.json', 'vitest.config.ts', 'capacitor.config.ts', 'index.html', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test offline accounting and encrypted backups
        run: npm test
      - name: Build original interface
        run: npm run build
      - name: Initialize and sync Android plugins
        run: |
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<application','<application android:allowBackup="false"',1)
          p.write_text(s)
          PY
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Check APK metadata and checksum
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: artk-accounting-offline-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
